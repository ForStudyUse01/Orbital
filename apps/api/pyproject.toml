[project]
name = "oei-api"
version = "0.1.0"
description = "Orbital Environment Intelligence API and pipeline"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "numpy>=2.1.0",
  "orjson>=3.10.0",
  "pandas>=2.2.0",
  "polars>=1.18.0",
  "psycopg[binary]>=3.2.0",
  "pyarrow>=18.0.0",
  "pydantic-settings>=2.7.0",
  "pyjwt[crypto]>=2.10.0",
  "python-multipart>=0.0.20",
  "sgp4>=2.24",
  "sentry-sdk[fastapi]>=2.20.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[project.scripts]
oei-pipeline = "oei_pipeline.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oei_api", "src/oei_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
