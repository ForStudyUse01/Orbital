services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oei
      POSTGRES_USER: oei
      POSTGRES_PASSWORD: oei
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oei"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

