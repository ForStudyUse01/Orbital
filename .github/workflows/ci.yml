name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --project apps/api --extra dev --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run --project apps/api ruff format apps/api --check
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api pytest --cov=oei_api --cov=oei_pipeline
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @oei/web exec playwright install --with-deps chromium
      - run: pnpm --filter @oei/web test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-safe-web-build
          path: apps/web/dist
